dependencies {
    implementation project(':core')
    implementation "com.github.xpenatan.gdx-teavm:backend-teavm:$gdxTeaVMVersion"
    implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-teavm:$gdxTeaVMVersion"
}

def webappDir = layout.buildDirectory.dir('dist/webapp')

// Compiles the game to JavaScript; output goes to teavm/build/dist/webapp
tasks.register('buildJavaScript', JavaExec) {
    dependsOn 'classes'
    group = 'build'
    description = 'Compile the game to JavaScript with TeaVM'
    mainClass = 'yio.tro.opacha.teavm.TeaVMBuilder'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = projectDir
}

// Builds and serves the game at http://localhost:8080 (uses jwebserver from JDK 18+)
tasks.register('run', Exec) {
    dependsOn 'buildJavaScript'
    group = 'application'
    description = 'Build the web version and serve it locally'
    def javaHome = System.getProperty('java.home')
    commandLine "$javaHome/bin/jwebserver", '-b', '127.0.0.1', '-p', '8080', '-d', webappDir.get().asFile.absolutePath
}
